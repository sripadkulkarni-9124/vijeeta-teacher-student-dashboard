steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - CANDIDATE_IMAGE=${_IMAGE}
    args:
      - -ceu
      - |
        prefix='asia-south1-docker.pkg.dev/neetcompanion-50b1f/cloud-run-source-deploy/vijeeta-dashboard:'
        image="$${CANDIDATE_IMAGE}"
        [[ "$${image}" == "$${prefix}"* ]]
        tag="$${image#"$${prefix}"}"
        [[ "$${tag}" =~ ^[0-9a-f]{40}$$ ]]
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=apps/dashboard-web/Dockerfile
      - --tag=${_IMAGE}
      - --build-arg=NEXT_PUBLIC_DASHBOARD_MODE=v3-proxy
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=neetcompanion-50b1f.firebaseapp.com
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=neetcompanion-50b1f
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=1:840759107103:web:84391539f65c7aa4abff2a
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
